<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6eee8">
<link rel="manifest" href="manifest.webmanifest">
<title>CPC Baby Bucks Boutique</title>
<style>
:root{--bg:#fbf8f5;--card:#fff;--ink:#403a36;--muted:#7c716a;--line:#eadfd7;--accent:#987d6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#f6eee8;border-bottom:1px solid var(--line);padding:20px 16px;position:sticky;top:0;z-index:2}
h1{font-size:22px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}
nav{display:flex;gap:7px;overflow:auto;margin-top:14px}nav button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px}
nav button{white-space:nowrap;border-radius:22px}nav button.active,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.metric{font-size:28px;font-weight:750}
.muted{font-size:13px;color:var(--muted)}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:15px 0}
select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white}
.tag{padding:7px 9px;border-radius:10px;font-size:12px;font-weight:700}.Good{background:#eaf5ed;color:#3d8a60}.Low{background:#fff4d7;color:#b88420}
.Need{background:#fbe9e7;color:#b94a45}.Overflow{background:#e7f1f9;color:#467da6}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.actions{text-align:right;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:28px}
.notice{background:#fff7df;border:1px solid #f0dfad;border-radius:12px;padding:12px;font-size:13px}
.error{background:#fdeceb;border:1px solid #e4b8b5;border-radius:12px;padding:14px;font-size:14px}
dialog{border:0;border-radius:18px;width:min(94vw,560px);padding:20px}dialog::backdrop{background:#0005}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.small{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
button{font:inherit}
</style>
</head>
<body>
<header>
<h1>🧸 CPC Baby Bucks Boutique</h1>
<div class="sub">Shared donation inventory</div>
<nav id="nav"></nav>
</header>
<main id="app"><div class="notice">Loading CPC Baby Bucks Boutique…</div></main>

<dialog id="login">
<h2>Volunteer sign in</h2>
<label class="small">Email</label><input id="email" type="email" autocomplete="username">
<label class="small">Password</label><input id="password" type="password" autocomplete="current-password">
<p id="loginMsg" class="muted"></p>
<button class="btn primary" id="signIn">Sign in</button>
</dialog>

<dialog id="editor">
<h2 id="editorTitle">Add inventory</h2>
<div class="form">
<div class="full"><label class="small">Section</label><select id="section"></select></div>
<div><label class="small">Gender</label><select id="gender"><option>Boys</option><option>Girls</option><option>All / Unisex</option></select></div>
<div><label class="small">Size</label><select id="size"></select></div>
<div><label class="small">Season / weight</label><select id="season"></select></div>
<div><label class="small">Type / style</label><select id="type"></select></div>
<div><label class="small">Status</label><select id="status"><option>Good</option><option>Low</option><option>Need</option><option>Overflow</option></select></div>
<div class="full"><label class="small">Tote / location</label><input id="tote"></div>
<div class="full"><label class="small">Notes</label><input id="notes"></div>
</div>
<p class="actions"><button class="btn" id="cancel">Cancel</button> <button class="btn primary" id="save">Save</button></p>
</dialog>

<!-- Use the explicit UMD build so Safari/iPhone loads the Supabase client reliably. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";

const SUPABASE_URL="https://zxycnekpzrudjqlxsmks.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_s3iWw4T5KlMFYUwiNXMbFA_uQ3VKQNc";

const cfg={
"Clothing":{s:["NB","0–3M","3M","6M","9M","12M","2T","3T","4T","5T"],w:["Summer","Winter"],t:["Tops","Bottoms","Outfits / Dresses"]},
"Onesies":{s:["NB","0–3M","3–6M","6–9M","12–24M"],w:["All"],t:["Short Sleeve","Long Sleeve"]},
"Sleepers":{s:["NB","0–3M","3M","6M","9M","12M","2T","3T","4T","5T"],w:["Lightweight","Heavyweight"],t:["Sleepers"]},
"Baby Essentials":{s:["Not size-specific"],w:["All"],t:["Shampoo","Lotion","Ointment","Diaper Cream","Baby Wash","Wipes","Diapers","Bottles","Pacifiers","Blankets","Bibs","Other"]},
"Maternity Clothes":{s:["XS","S","M","L","XL","2XL","3XL"],w:["Summer","Winter"],t:["Tops","Bottoms"]}
};
const sections=Object.keys(cfg);
let db=null,current="Dashboard",rows=[],editId=null;
const $=id=>document.getElementById(id);
const safe=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tag=s=>'<span class="tag '+safe(s)+'">'+(s==="Good"?"🟢":s==="Low"?"🟡":s==="Need"?"🔴":"🔵")+" "+safe(s)+"</span>";

function showError(message){
  $("app").innerHTML='<div class="error"><strong>Something went wrong.</strong><br><br>'+safe(message)+'</div>';
}

function nav(){
  $("nav").innerHTML=["Dashboard",...sections].map(x=>'<button class="'+(x===current?"active":"")+'" data-x="'+safe(x)+'">'+safe(x)+"</button>").join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{current=b.dataset.x;render();});
}

async function load(){
  try{
    const r=await db.from("inventory").select("*").order("created_at");
    if(r.error){showError(r.error.message);return;}
    rows=r.data||[];
    render();
  }catch(e){showError(e&&e.message?e.message:String(e));}
}

function render(){
  nav();
  if(current==="Dashboard"){dash();return;}
  const c=cfg[current];
  $("app").innerHTML='<div class="top"><div><h2>'+safe(current)+'</h2><div class="sub">Track status, not individual quantities.</div></div><button class="btn primary" id="add">＋ Add</button></div>'+
  '<div class="filters"><select id="fg"><option>All genders</option><option>Boys</option><option>Girls</option><option>All / Unisex</option></select>'+
  '<select id="fs"><option>All sizes</option>'+c.s.map(x=>"<option>"+safe(x)+"</option>").join("")+'</select>'+
  '<select id="fw"><option>All seasons/weights</option>'+[...new Set(c.w)].map(x=>"<option>"+safe(x)+"</option>").join("")+'</select></div><div id="list"></div>';
  $("add").onclick=()=>openEditor();
  ["fg","fs","fw"].forEach(id=>$(id).onchange=list);
  list();
}

function list(){
  const g=$("fg")?.value||"All genders",s=$("fs")?.value||"All sizes",w=$("fw")?.value||"All seasons/weights";
  const a=rows.filter(x=>x.section===current&&(g==="All genders"||x.gender===g)&&(s==="All sizes"||x.size===s)&&(w==="All seasons/weights"||x.season_or_weight===w));
  $("list").innerHTML=a.length?a.map(x=>'<div class="card"><div class="row"><strong>'+safe(x.gender)+" · "+safe(x.size)+"</strong>"+tag(x.status)+'</div><div class="muted">'+safe(x.season_or_weight)+" · "+safe(x.item_type)+'</div><div class="muted">📦 '+safe(x.tote_location)+'</div><div class="muted">📝 '+safe(x.notes)+'</div><div class="actions"><button class="btn" onclick="openEditor(\''+safe(x.id)+"')\">Edit</button> <button class=\"btn\" onclick=\"removeRow('"+safe(x.id)+"')\">Delete</button></div></div>").join(""):'<div class="empty">No entries yet.</div>';
}

function dash(){
  const needs=rows.filter(x=>x.status==="Need"||x.status==="Low"),over=rows.filter(x=>x.status==="Overflow");
  $("app").innerHTML='<div class="top"><div><h2>Welcome</h2><div class="sub">One shared view for every volunteer.</div></div><button class="btn primary" id="add">＋ Add</button></div>'+
  '<div class="grid">'+["Good","Low","Need","Overflow"].map(s=>'<div class="card"><div class="metric">'+rows.filter(x=>x.status===s).length+'</div><div class="muted">'+s+"</div></div>").join("")+'</div><h2>🚨 What we need</h2>'+summary(needs,"Nothing marked Low or Need. 🎉")+'<h2>🔵 Overflow</h2>'+summary(over,"Nothing marked Overflow.");
  $("add").onclick=()=>openEditor();
}

function summary(a,empty){
  return a.length?a.map(x=>'<div class="card"><div class="row"><strong>'+safe(x.section)+" · "+safe(x.gender)+" · "+safe(x.size)+"</strong>"+tag(x.status)+'</div><div class="muted">'+safe(x.season_or_weight)+" · "+safe(x.item_type)+" · 📦 "+safe(x.tote_location)+"</div></div>").join(""):'<div class="empty">'+empty+"</div>";
}

function options(item){
  const c=cfg[$("section").value];
  $("size").innerHTML=c.s.map(x=>"<option>"+safe(x)+"</option>").join("");
  $("season").innerHTML=c.w.map(x=>"<option>"+safe(x)+"</option>").join("");
  $("type").innerHTML=c.t.map(x=>"<option>"+safe(x)+"</option>").join("");
  if(item){$("size").value=item.size;$("season").value=item.season_or_weight;$("type").value=item.item_type;}
}

function openEditor(id){
  editId=id||null;
  const item=id?rows.find(x=>x.id===id):null;
  $("editorTitle").textContent=item?"Edit inventory":"Add inventory";
  $("section").innerHTML=sections.map(x=>"<option>"+safe(x)+"</option>").join("");
  $("section").value=item?.section||(current==="Dashboard"?"Clothing":current);
  options(item);
  $("gender").value=item?.gender||"Boys";
  $("status").value=item?.status||"Good";
  $("tote").value=item?.tote_location||"";
  $("notes").value=item?.notes||"";
  $("editor").showModal();
}

$("section").onchange=()=>options();
$("cancel").onclick=()=>$("editor").close();

$("save").onclick=async()=>{
  const p={section:$("section").value,gender:$("gender").value,size:$("size").value,season_or_weight:$("season").value,item_type:$("type").value,status:$("status").value,tote_location:$("tote").value,notes:$("notes").value,updated_at:new Date().toISOString()};
  try{
    const r=editId?await db.from("inventory").update(p).eq("id",editId):await db.from("inventory").insert(p);
    if(r.error){alert(r.error.message);return;}
    $("editor").close();load();
  }catch(e){alert(e&&e.message?e.message:String(e));}
};

window.removeRow=async function(id){
  if(!confirm("Delete this entry?"))return;
  const r=await db.from("inventory").delete().eq("id",id);
  if(r.error)alert(r.error.message);else load();
};

window.openEditor=openEditor;

$("signIn").onclick=async()=>{
  $("loginMsg").textContent="Signing in…";
  const r=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  if(r.error)$("loginMsg").textContent=r.error.message;
  else{$("login").close();load();}
};

async function start(){
  try{
    if(!window.supabase||!window.supabase.createClient){
      showError("The Supabase library did not load. Please refresh the page and try again.");
      return;
    }
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const r=await db.auth.getSession();
    if(r.error){showError(r.error.message);return;}
    if(!r.data.session)$("login").showModal();
    else load();
  }catch(e){
    showError(e&&e.message?e.message:String(e));
  }
}
start();
})();
</script>
</body>
</html>
